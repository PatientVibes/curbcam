name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Install from uv.lock, NOT by re-resolving. `uv pip install -e ".[dev]"`
      # ignores the lockfile and resolves the newest release of every dev tool
      # at run time, so a tool release could turn CI red with no code change --
      # which is exactly what happened when ruff 0.16 began formatting Python
      # code blocks inside Markdown and put docs/**/*.md in scope. Syncing from
      # the lock pins ruff (and mypy, and pytest) to the reviewed version.
      - name: Install from lockfile (dev extras)
        run: uv sync --extra dev --frozen --python ${{ matrix.python }}

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy (strict)
        run: uv run --no-sync mypy src/curbcam

      - name: Tests (e2e excluded via addopts -m 'not e2e')
        run: uv run --no-sync pytest -q

  # Aggregate the matrix into a single stable status context named "gates" so
  # branch protection can require "gates" without pinning each matrix leg
  # (the per-leg checks are "gates (py3.12)" / "gates (py3.13)").
  gates-all:
    name: gates
    if: always()
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates legs to pass
        run: |
          if [ "${{ needs.gates.result }}" != "success" ]; then
            echo "gates matrix result: ${{ needs.gates.result }}"
            exit 1
          fi
